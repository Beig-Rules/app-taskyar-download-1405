<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسک‌یار | مدیریت وظایف هوشمند</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0a0a; --fg:#fafafa; --accent:#10b981; --muted:#a1a1aa; }
[data-theme=light]{ --bg:#fafafa; --fg:#0a0a0a; --accent:#059669; }
body{font-family:Vazirmatn,system-ui;background:var(--bg);color:var(--fg);margin:0;}
.container{max-width:1000px;margin:auto;padding:0 20px;}
header{display:flex;justify-content:space-between;padding:24px 0;}
.hero{text-align:center;padding:100px 0;}
.hero h1{font-size:3.2rem;margin-bottom:12px;}
.btn{background:var(--accent);color:#fff;padding:16px 32px;border-radius:10px;text-decoration:none;font-weight:600;}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding:60px 0;}
.feature{padding:24px;border:1px solid var(--muted);border-radius:12px;}
footer{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>
<header class="container"><div style="font-weight:700;font-size:1.5rem;">تسک‌یار</div><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">تم</button></header>
<section class="hero container">
<h1>وظایف‌ت رو هوشمند مدیریت کن</h1>
<p style="font-size:1.25rem;color:var(--muted);max-width:560px;margin:16px auto 32px;">اپ مدیریت وظایف فارسی با هوش مصنوعی، همگام‌سازی تقویم و گزارش‌گیری پیشرفته.</p>
<a href="#" class="btn">دانلود رایگان</a>
</section>
<section class="features container">
<div class="feature"><h3>هوش مصنوعی</h3><p>پیشنهاد اولویت و تقسیم هوشمند وظایف.</p></div>
<div class="feature"><h3>همگام‌سازی</h3><p>اتصال به Google Calendar و نوشن‌ده‌ها.</p></div>
<div class="feature"><h3>رابط فارسی</h3><p>تمام متون و راهنمای به زبان فارسی.</p></div>
</section>
<footer>تسک‌یار © 1405</footer>
</body>
</html>
